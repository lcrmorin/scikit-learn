name: Newton–Cholesky Array API (fork CPU)

on:
  push:
    branches: [newton-cholesky-array-api]

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    if: github.repository == 'lcrmorin/scikit-learn'
    env:
      SCIPY_ARRAY_API: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install package and CPU backends
        run: |
          python -m pip install . pytest array-api-strict
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run Newton solver parity and regression tests
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest -q --pyargs sklearn.linear_model.tests.test_logistic sklearn.linear_model._glm.tests.test_glm -k 'newton_cholesky or warm_start_newton_solver or linalg_warning_with_newton_solver or newton_solver_verbosity or multinomial_identifiability'
