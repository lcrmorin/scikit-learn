name: Newton-Cholesky Array API review

on:
  push:
    branches: [newton-cholesky-array-api-review-ci]

permissions:
  contents: read

jobs:
  array-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCIPY_ARRAY_API: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      SKLEARN_SKIP_NETWORK_TESTS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 3fe145ace7d52a4260b6ae668388edfe70907722
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install the review commit and test dependencies
        run: |
          python -m pip install 'pip>=26.2.2'
          python -m pip install . pytest array-api-strict
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test Newton-Cholesky
        working-directory: ${{ runner.temp }}
        run: |
          sklearn_path=$(python -c 'from pathlib import Path; import sklearn; print(Path(sklearn.__file__).parent)')
          python -m pytest -q "$sklearn_path/linear_model/_glm/tests/test_newton_solver.py" "$sklearn_path/linear_model/tests/test_logistic.py" \
            -k 'newton_cholesky or (test_logistic_regression_array_api_compliance and newton-cholesky)'
          python -m pytest -q "$sklearn_path/tests/test_common.py" \
            -k 'LogisticRegression and not LogisticRegressionCV and newton-cholesky and check_array_api_input'
